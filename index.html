<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg-color: green;
    }
    * {
      margin: 0;
      padding: 0;
      font-family: "Trebuchet MS";
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100vh;
      background-color: var(--bg-color);
    }
    .row {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .a {
      height: 20vh;
      font-size: 15vh;
    }
    .b {
      height: 60vh;
      font-size: 60vh;
    }
    .c {
      height: 20vh;
      font-size: 10vh;
    }
  </style>
</head>
<body>
  <div class="container" id="bg">
    <div class="row a" id="rule"></div>
    <div class="row b" id="time">0:00</div>
    <div class="row c" id="message"></div>
  </div>
  <script>
    const periods = [
      { start: "9:15", end: "9:30", message: "9:30" },
      { start: "10:20", end: "10:35", message: "10:35" },
      { start: "10:46", end: "11:01", message: "11:01" },
      { start: "11:50", end: "12:05", message: "12:05" },
      { start: "12:45", end: "13:00", message: "1:00" },
      { start: "13:49", end: "14:04", message: "2:04" },
      { start: "14:14", end: "14:29", message: "2:29" },
      { start: "15:15", end: "15:30", message: "3:30" }
    ];
    
    // Internet-synchronized time, tracked independently of the system clock.
    let syncedEpochMs = null;
    let syncPerformanceMs = null;
    let syncing = false;
    
    async function updateTimeFromInternet() {
      if (syncing) return;
      syncing = true;
    
      const requestStart = performance.now();
    
      try {
        const response = await fetch(
          "https://worldtime.timezone.io/api/timezone/Etc/UTC",
          { cache: "no-store" }
        );
    
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
    
        const data = await response.json();
    
        if (!Number.isFinite(data.unixtime)) {
          throw new Error("Missing or invalid Unix timestamp");
        }
    
        syncedEpochMs = data.unixtime * 1000;
        syncPerformanceMs =
          (requestStart + performance.now()) / 2;
    
        console.log("Internet time synchronized:", data);
      } catch (error) {
        console.error("Time sync failed:", error);
      } finally {
        syncing = false;
      }
    }
    
    function getCurrentPacificTime() {
      if (syncedEpochMs === null) {
        return null;
      }
    
      const utcMs =
        syncedEpochMs + (performance.now() - syncPerformanceMs);
    
      // UTC-7, expressed as UTC components to avoid Windows' time zone.
      return new Date(utcMs - 7 * 60 * 60 * 1000);
    }
    
    function updateDisplay(state, message = "") {
      document.documentElement.style.setProperty(
        "--bg-color",
        state === "red" ? "red" : "green"
      );
    
      document.querySelector("#rule").innerHTML =
        state === "red" ? "15 minute rule" : "";
    
      document.querySelector("#message").innerHTML =
        message ? `Remain in class until ${message}` : "";
    }
    
    function updateClock() {
      const currentTime = getCurrentPacificTime();
    
      const hh = currentTime.getUTCHours();
      const mm = currentTime.getUTCMinutes();
      const time12hr = `${hh % 12 || 12}:${String(mm).padStart(2, "0")}`;
    
      const currentMillis =
        ((hh * 60 + mm) * 60 + currentTime.getUTCSeconds()) * 1000 +
        currentTime.getUTCMilliseconds();
    
      let isRed = false;
    
      for (const period of periods) {
        const [startH, startM] = period.start.split(":").map(Number);
        const [endH, endM] = period.end.split(":").map(Number);
    
        const startMillis = (startH * 60 + startM) * 60000;
        const endMillis = (endH * 60 + endM) * 60000;
    
        if (currentMillis >= startMillis && currentMillis < endMillis) {
          updateDisplay("red", period.message);
          isRed = true;
          break;
        }
      }
    
      if (!isRed) {
        updateDisplay("green");
      }
    
      document.querySelector("#time").textContent = time12hr;
    }
    
    // Update the display every second; synchronize every five minutes.
    setInterval(updateClock, 1000);
    setInterval(updateTimeFromInternet, 300000);
    
    // Synchronize immediately on startup.
    updateTimeFromInternet();
    updateClock();
    
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        updateTimeFromInternet();
      }
    });
    
    window.addEventListener("focus", updateTimeFromInternet);

  </script>
</body>
</html>
